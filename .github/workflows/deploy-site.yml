name: Deploy landing site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "shared/tokens.css"
      - "scripts/build-site.mjs"
      - ".github/workflows/deploy-site.yml"
  # PRs only run the build job's checks; the deploy job is main-only.
  pull_request:
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR check runs get their own group so they never queue a real deploy.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # site/index.html (static text + JSON-LD) and site/he/index.html are built
      # from site/assets/i18n.js; fail if someone edited one without the other.
      - name: Static pages in sync with the i18n dictionary
        run: node scripts/build-site.mjs --check

      - name: Assemble publish tree
        run: |
          set -euo pipefail
          mkdir -p _site
          # Copy the site itself to the publish root.
          cp -r site/. _site/
          # Replace the dev shim with the canonical tokens.
          # In dev, site/tokens.css @imports ../shared/tokens.css. The
          # published site is flat, so we inline the real tokens here.
          cp shared/tokens.css _site/tokens.css
          # Sanity check.
          test -f _site/index.html
          test -f _site/he/index.html
          test -f _site/llms.txt
          test -f _site/privacy.html
          test -f _site/tokens.css
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/assets/img/hero-light.png
          test -f _site/assets/img/hero-light-1920.webp
          test -f _site/assets/img/og-card.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
